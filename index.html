<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Logistics Investment</title>
    <style>
        body {
            font-family: 'Roboto', 'Helvetica Neue', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: auto;
            margin: auto;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .product {
            background: #fff;
            margin: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: calc(25% - 40px);
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .product {
                width: 100%;
                margin: 10px 0;
            }
        }
        .paypal-button {
            text-align: center;
        }
        .pp-2LUPAB42TQ35S {
            text-align: center;
            border: none;
            border-radius: 0.25rem;
            min-width: 11.625rem;
            padding: 0 2rem;
            height: 2.625rem;
            font-weight: bold;
            background-color: #FFD140;
            color: #000000;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 1rem;
            line-height: 1.25rem;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="product">
            <img src="glass1.jpg" alt="Double pane glass-3ft x 5ft" loading="lazy">
            <h2>Double pane glass-3ft x 5ft</h2>
            <p>This high-quality double pane glass measures 3 feet by 5 feet, perfect for small to medium-sized windows. It provides excellent insulation and noise reduction, making it ideal for residential and commercial applications.</p>
            <button class="pp-2LUPAB42TQ35S" onclick="openPayPal('https://www.paypal.com/ncp/payment/2LUPAB42TQ35S')">Buy Now</button>
        </div>
    </div>

    <div id="paypalModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePayPal()">&times;</span>
            <iframe id="paypalIframe" style="width:100%; height:500px;" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        function openPayPal(url) {
            document.getElementById('paypalIframe').src = url;
            document.getElementById('paypalModal').style.display = 'block';
        }
        function closePayPal() {
            document.getElementById('paypalModal').style.display = 'none';
        }
    </script>
</body>
</html>
